apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: dmz
  labels:
    app: jellyfin
    zone: dmz
    security-tier: public-facing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
        zone: dmz
        security-tier: public-facing
    spec:
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8096
          name: http
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 2048Mi
        volumeMounts:
        - name: media-storage
          mountPath: /media
          readOnly: true
        - name: jellyfin-config
          mountPath: /config
        - name: jellyfin-cache
          mountPath: /cache
      volumes:
      - name: media-storage
        hostPath:
          path: /mnt/pcloud
          type: Directory
      - name: jellyfin-config
        hostPath:
          path: /opt/jellyfin/config
          type: DirectoryOrCreate
      - name: jellyfin-cache
        hostPath:
          path: /opt/jellyfin/cache
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: dmz
  labels:
    app: jellyfin
    zone: dmz
spec:
  type: ClusterIP
  selector:
    app: jellyfin
  ports:
  - name: http
    port: 8096
    targetPort: 8096
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-ingress
  namespace: dmz
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jellyfin-service
            port:
              number: 8096
